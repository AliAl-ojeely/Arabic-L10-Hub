
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توثيق Arabic L10 Hub - معرب</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080b12;
      color: #f7f8fc;
      font-family: Tahoma, Arial, sans-serif;
    }

    main {
      width: min(90%, 620px);
      padding: 40px 25px;
      text-align: center;
      background: #111827;
      border: 1px solid #29476e;
      border-radius: 18px;
    }

    h1 {
      color: #e5b94a;
      font-size: 1.6rem;
    }

    p {
      line-height: 2;
    }

    .code {
      margin: 25px auto;
      padding: 20px 10px;
      border: 1px dashed #d5a73b;
      border-radius: 12px;
      background: #171d2b;
      color: #f5cd67;
      font-size: 1.5rem;
      font-weight: bold;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
    }
  </style>
</head>
<body>
  <main>
    <h1>إثبات ملكية حساب Arabic L10 Hub</h1>

    <p>
      أنا علي العجيلي، مؤسس وصاحب مشروع
      Arabic L10 Hub، أؤكد أنني المخوّل
      بتمثيل المشروع على منصة معرب.
    </p>

    <p>رمز التحقق الرسمي:</p>

    <div class="code" id="verification-code">
      معرب-6CFR-Q82E
    </div>

    <p>
      نُشر هذا الرمز لإثبات ارتباط الحساب
      بالمشروع والتحقق من صلاحية تمثيله.
    </p>
  </main>
</body>
</html>
